deploy:
  runs-on: self-hosted
  needs: docker   # dépend du job CI
  steps:
    - name: Login Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Pull la dernière image
      run: docker pull hadjimansour/testcicd:1.1.0

    - name: Stopper et supprimer l'ancien conteneur
      run: |
        if [ $(docker ps -aq -f name=testcicd_container) ]; then
          docker stop testcicd_container
          docker rm testcicd_container
        fi

    - name: Lancer le nouveau conteneur
      run: docker run -d --name testcicd_container -p 80:80 hadjimansour/testcicd:1.1.0
