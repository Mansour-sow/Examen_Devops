name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: mon-site-web
  IMAGE_TAG: latest
  DOCKER_REGISTRY: docker.io

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v3

      - name: Login Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image Docker
        run: |
          docker build -t $DOCKER_REGISTRY/${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:$IMAGE_TAG .

      - name: Push image Docker
        run: |
          docker push $DOCKER_REGISTRY/${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:$IMAGE_TAG

  scan:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Scan avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: docker.io/${{ secrets.DOCKER_USERNAME }}/mon-site-web:latest
          severity: HIGH,CRITICAL
          exit-code: 1

  deploy:
    runs-on: self-hosted
    needs: scan

    steps:
      - name: Pull image Docker
        run: |
          docker pull docker.io/${{ secrets.DOCKER_USERNAME }}/mon-site-web:latest

      - name: Stop ancien conteneur
        run: |
          docker stop mon-conteneur || true

      - name: Supprimer ancien conteneur
        run: |
          docker rm mon-conteneur || true

      - name: Lancer nouveau conteneur
        run: |
          docker run -d -p 80:80 --name mon-conteneur docker.io/${{ secrets.DOCKER_USERNAME }}/mon-site-web:latest
